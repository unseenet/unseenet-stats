name: tests
on:
  push:
    branches: [main]
    paths: ["src/**", "tests/**", "pyproject.toml", ".github/workflows/tests.yml"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install ".[dev]"
      - run: pytest -q

  core-main:
    # The next core release (unseenet main), so this repo is ready the day it is
    # released (unseenet/unseenet#386 section 4).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install ".[dev]"
      - run: pip install --force-reinstall --no-deps "unseenet @ git+https://github.com/unseenet/unseenet@main"
      - run: pip install "unseenet @ git+https://github.com/unseenet/unseenet@main"   # its new dependencies, if any
      - run: python -m pytest -q
