name: stats
# Once a day: count the network over Tor (src/unseenet_stats), commit the new
# numbers (docs/data/stats.json) and publish the page. A push to the page's
# files publishes it again without counting.
on:
  schedule:
    - cron: "17 5 * * *"              # after unseenet's node-health check (04:41)
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["docs/**", "hooks/**", "mkdocs.yml", ".github/workflows/stats.yml"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: stats
  cancel-in-progress: false

jobs:
  count:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install .
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq tor && (sudo systemctl stop tor || true)
      - run: unseenet-stats -v --out docs/data/stats.json
      - name: Commit the numbers
        run: |
          if git diff --quiet; then echo "no changes"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/stats.json
          git commit -q -m "Statistics: daily count"
          git pull --rebase -q origin main
          git push -q origin HEAD:main

  build:
    needs: count
    if: always() && (needs.count.result == 'success' || needs.count.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main                    # with the numbers just committed
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install mkdocs-material
      - run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
