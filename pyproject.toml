[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "unseenet-stats"
version = "0.1.0.dev0"
description = "Statistics for the Unseenet network, counted from what any reader can see"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Andreas Lorensen" }]
requires-python = ">=3.11"
dependencies = [
    "unseenet @ git+https://github.com/unseenet/unseenet.git",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
unseenet-stats = "unseenet_stats.crawl:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
