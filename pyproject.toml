[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "unseenet-stats"
dynamic = ["version"]
description = "Statistics for the Unseenet network, counted from what any reader can see"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Andreas Lorensen" }]
requires-python = ">=3.11"
dependencies = [
    "unseenet>=0.5,<0.6",   # one minor version of the core at a time
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
unseenet-stats = "unseenet_stats.crawl:main"

[project.urls]
Homepage = "https://github.com/unseenet/unseenet-stats"

[tool.setuptools.dynamic]
version = { attr = "unseenet_stats.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
